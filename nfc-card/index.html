<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Call or WhatsApp Moh Saleh: 079 613 8006">
<title>Moh Saleh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Manrope:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: #11303b;
    --fg: #e9eef0;
    --muted: #9fb3bb;
    --foil: #d4b471;
    --call: #f1dca4;
    --call-ink: #11303b;
    --wa: #25d366;
    --wa-ink: #07301a;
    --font-display: "Bodoni Moda", Georgia, serif;
    --font-body: "Manrope", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 70% at 0% 0%, #1a4352, transparent 60%), var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
  }
  main {
    min-height: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding-block: max(48px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 40px;
  }
  .mono {
    width: 64px; height: 64px;
    display: grid; place-items: center;
    border: 1px solid var(--foil);
    border-radius: 50%;
    font: italic 500 28px/1 var(--font-display);
    color: var(--foil);
  }
  h1 {
    font: 500 clamp(40px, 12vw, 56px)/1.05 var(--font-display);
    margin: 20px 0 10px;
    color: var(--foil);
  }
  .num {
    font-size: 18px;
    letter-spacing: .08em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .buttons { display: grid; gap: 14px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 20px;
    border-radius: 16px;
    font: 700 19px/1 var(--font-body);
    text-decoration: none;
    transition: transform .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  .btn svg { width: 24px; height: 24px; }
  .call { background: var(--call); color: var(--call-ink); }
  .wa { background: var(--wa); color: var(--wa-ink); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="mono" aria-hidden="true">MS</div>
    <h1>Moh Saleh</h1>
    <div class="num">079 613 8006</div>
  </header>
  <div class="buttons">
    <a class="btn call" href="tel:+962796138006">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      Call me
    </a>
    <a class="btn wa" href="https://wa.me/962796138006">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
      WhatsApp me
    </a>
  </div>
</main>
</body>
</html>
