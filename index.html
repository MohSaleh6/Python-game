<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--/SKELETON-->
<title>Python Quest – Escape the Coding Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive Python adventure for Grade 7–8 ICT students: master print(), input(), variables, if/else and if/elif/else, then pass the final exam simulation.">
<meta name="theme-color" content="#050b14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: a lab console. HUD strip on top, a vertical circuit "spine" that links the five rooms,
   and every challenge framed as a terminal console with line-numbered code. Single dark theme by design. */
:root{
  --bg:#050b14; --bg-2:#081322; --panel:#0b1828; --panel-2:#0f2036; --panel-3:#132a45;
  --line:#1a3452; --line-2:#24476d; --grid:rgba(41,230,255,.045);
  --text:#e2eefb; --muted:#93a9c4; --dim:#5f7896;
  --cyan:#29e6ff; --blue:#3f8cff; --green:#43f5a5; --amber:#ffcc4d; --red:#ff5d7d;
  --cyan-a:rgba(41,230,255,.14); --blue-a:rgba(63,140,255,.16); --green-a:rgba(67,245,165,.14);
  --amber-a:rgba(255,204,77,.15); --red-a:rgba(255,93,125,.14); --shade:rgba(2,6,12,.72);
  --ink:#03101a;
  --t-kw:#5fb3ff; --t-fn:#29e6ff; --t-str:#7dffb7; --t-num:#ffcc4d; --t-com:#5f7896; --t-op:#c8d7ea; --t-id:#e2eefb;
  --font-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
  --r:14px; --r-sm:10px;
  --chamfer:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:400 17px/1.55 var(--font-body);overflow-x:hidden;
  background:
    radial-gradient(1100px 560px at 85% -12%,var(--cyan-a),transparent 62%),
    radial-gradient(900px 520px at -15% 35%,var(--blue-a),transparent 60%),
    var(--bg);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 78%)}
#app{position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
a{color:var(--cyan)}
code,kbd,pre,.mono{font-family:var(--font-mono)}
code{font-size:.92em;color:var(--cyan);background:var(--cyan-a);padding:.08em .38em;border-radius:6px;white-space:nowrap}
kbd{font-size:.88em;color:var(--green);background:var(--green-a);border:1px solid rgba(67,245,165,.35);padding:.06em .45em;border-radius:6px}
button{font:inherit;color:inherit}
button,select,input,textarea{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.eyebrow{font-family:var(--font-display);font-size:.8rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.muted{color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:52px;padding:0 22px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--text);font-family:var(--font-display);font-weight:600;font-size:1.02rem;letter-spacing:.04em;cursor:pointer;
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease;text-decoration:none;user-select:none}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan-a),0 0 22px -6px var(--cyan)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:linear-gradient(180deg,#4df0ff,var(--cyan));color:var(--ink);border-color:transparent;box-shadow:0 0 26px -8px var(--cyan)}
.btn.primary:hover{box-shadow:0 0 0 2px var(--cyan-a),0 0 34px -6px var(--cyan)}
.btn.go{background:linear-gradient(180deg,#7dffc0,var(--green));color:var(--ink);border-color:transparent;box-shadow:0 0 26px -8px var(--green)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,93,125,.5);color:var(--red)}
.btn.danger:hover{box-shadow:0 0 22px -6px var(--red);border-color:var(--red)}
.btn.sm{min-height:42px;padding:0 14px;font-size:.92rem;border-radius:10px}
.btn[disabled],.btn.disabled{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--cyan);border-color:var(--cyan)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,rgba(5,11,20,.96),rgba(5,11,20,.86));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 0;min-width:0}
.brand-mark{font-family:var(--font-mono);font-weight:700;color:var(--ink);background:var(--green);padding:3px 7px;border-radius:7px;font-size:.85rem;box-shadow:0 0 18px -4px var(--green)}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;white-space:nowrap}
.brand-name span{color:var(--cyan)}
.hud-stats{margin-left:auto;display:flex;align-items:center;gap:10px}
.hud-rank{display:flex;flex-direction:column;gap:3px;min-width:150px}
.hud-rank .top{display:flex;justify-content:space-between;gap:8px;font-size:.78rem}
.hud-rank .who{color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-rank .rank{font-family:var(--font-display);font-weight:600;color:var(--cyan);white-space:nowrap}
.xpbar{height:6px;border-radius:6px;background:var(--panel-3);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--green));border-radius:6px;transition:width .6s ease}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-family:var(--font-display);font-size:1.02rem}
.pill span{color:var(--muted);font-size:.8rem}
.pill .ic{color:var(--cyan)}
.pill.amber .ic{color:var(--amber)}
.pill.green .ic{color:var(--green)}
.pill.flame .ic{color:var(--amber)}
.teacher-tag{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(255,204,77,.4);padding:2px 8px;border-radius:999px}

/* Intro */
.intro{min-height:calc(100vh - 40px);display:grid;place-items:center;padding-block:40px}
.intro-card{max-width:760px;width:100%;display:flex;flex-direction:column;gap:22px}
.title-xl{font-size:clamp(2.6rem,7vw,4.6rem);line-height:.98;letter-spacing:.02em}
.title-xl .py{color:var(--cyan);text-shadow:0 0 28px rgba(41,230,255,.45)}
.title-sub{font-family:var(--font-display);font-size:clamp(1.05rem,2.6vw,1.4rem);color:var(--green);letter-spacing:.12em;text-transform:uppercase}
.lead{font-size:1.12rem;color:var(--muted);max-width:62ch}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--font-display);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.input{min-height:54px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--text);padding:0 16px;font:600 1.05rem var(--font-mono);width:100%}
.input:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px var(--cyan-a)}
.rooms-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rooms-strip div{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;font-size:.8rem;color:var(--muted);min-width:0}
.rooms-strip b{display:block;font-family:var(--font-mono);color:var(--cyan);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Terminal */
.term{background:#02070d;border:1px solid var(--line);border-radius:var(--r-sm);font:400 .95rem/1.6 var(--font-mono);color:var(--green);padding:12px 14px;min-height:52px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.term-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 .72rem var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.term .err{color:var(--red)}
.term .hint{color:var(--amber);font-family:var(--font-body)}
.term .typed{color:var(--cyan)}
.term .cursor{display:inline-block;width:.6em;height:1.1em;background:var(--green);vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Hero (map) */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:34px 18px}
.hero h1{font-size:clamp(2rem,4.6vw,3.2rem)}
.hero h1 em{font-style:normal;color:var(--cyan)}
.hero .lead{margin-top:12px}
.hero .row{margin-top:22px}
.hero-term{clip-path:var(--chamfer);background:linear-gradient(160deg,var(--panel-2),var(--panel));padding:1px}
.hero-term .in{clip-path:var(--chamfer);background:#02070d;padding:18px 20px;font:400 .95rem/1.75 var(--font-mono)}
.hero-term .p{color:var(--dim)}
.hero-term .o{color:var(--green)}
.lab-progress{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 18px}
.lab-progress .lbl{font-family:var(--font-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--muted)}
.lab-progress .num{font-family:var(--font-display);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
.pbar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pbar i{height:12px;border-radius:4px;background:var(--panel-3);position:relative;overflow:hidden}
.pbar i.on{background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 14px -3px var(--green)}
.pbar i.exam{background:repeating-linear-gradient(135deg,var(--panel-3) 0 6px,var(--panel-2) 6px 12px)}
.pbar i.exam.on{background:linear-gradient(90deg,var(--amber),var(--green))}

/* Mission map spine */
.map-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:34px;flex-wrap:wrap}
.map-head h2{font-size:1.6rem}
.spine{list-style:none;margin:22px 0 0;padding:0;position:relative;display:flex;flex-direction:column;gap:22px}
.spine::before{content:"";position:absolute;top:10px;bottom:10px;left:50%;width:3px;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--cyan),var(--blue) 50%,var(--green));opacity:.45;border-radius:3px;box-shadow:0 0 18px var(--cyan)}
.stop{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);align-items:center}
.stop .node{grid-column:2;grid-row:1;justify-self:center;width:52px;height:52px;border-radius:14px;transform:rotate(45deg);display:grid;place-items:center;
  background:var(--bg);border:2px solid var(--line-2);z-index:1;font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.stop .node>*{transform:rotate(-45deg)}
.stop.ready .node{border-color:var(--cyan);box-shadow:0 0 0 6px var(--cyan-a),0 0 26px -2px var(--cyan);color:var(--cyan);animation:pulse 2.4s ease-in-out infinite}
.stop.cleared .node{border-color:var(--green);background:var(--green);color:var(--ink);box-shadow:0 0 24px -4px var(--green)}
.stop.locked .node{color:var(--dim)}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(41,230,255,.06),0 0 30px 0 var(--cyan)}}
.stop.l .mcard{grid-column:1;grid-row:1}
.stop.r .mcard{grid-column:3;grid-row:1}
.mcard{position:relative;clip-path:var(--chamfer);background:linear-gradient(165deg,var(--line-2),var(--line));padding:1px;transition:transform .25s ease,filter .25s ease}
.mcard .in{clip-path:var(--chamfer);background:linear-gradient(165deg,var(--panel-2),var(--panel) 70%);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.stop.ready .mcard{background:linear-gradient(165deg,var(--cyan),var(--blue) 60%,var(--line))}
.stop.cleared .mcard{background:linear-gradient(165deg,var(--green),var(--line-2) 60%)}
.stop:not(.locked) .mcard:hover{transform:translateY(-3px);filter:drop-shadow(0 10px 24px rgba(41,230,255,.18))}
.stop.locked .mcard .in{opacity:.6}
.mcard-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.room{font:700 .78rem var(--font-mono);letter-spacing:.14em;color:var(--muted)}
.status{font:600 .72rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.status.ready{color:var(--cyan);border-color:var(--cyan);background:var(--cyan-a)}
.status.cleared{color:var(--green);border-color:var(--green);background:var(--green-a)}
.status.boss{color:var(--red);border-color:var(--red);background:var(--red-a)}
.mcard h3{font-size:1.45rem}
.mcard .concept code{font-size:1rem;white-space:nowrap}
.mcard .blurb{color:var(--muted);font-size:.98rem}
.mcard-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.stars{display:inline-flex;gap:3px}
.stars .ic{width:1.35em;height:1.35em;color:var(--panel-3)}
.stars .ic.on{color:var(--amber);filter:drop-shadow(0 0 6px rgba(255,204,77,.6))}
.best{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.locked-note{font-size:.88rem;color:var(--dim)}
.stop.exam .mcard{background:linear-gradient(165deg,var(--amber),var(--line-2) 60%)}
.stop.exam.locked .mcard{background:linear-gradient(165deg,var(--line-2),var(--line))}
.stop.exam .node{border-color:var(--amber);color:var(--amber)}
.stop.exam.cleared .node{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.stop.exam.locked .node{border-color:var(--line-2);color:var(--dim)}
.exam-meta{display:flex;flex-wrap:wrap;gap:8px}
.exam-meta span{font-size:.82rem;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;color:var(--muted)}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}
.badge svg{width:66px;height:74px}
.badge b{font-family:var(--font-display);font-size:.98rem}
.badge small{color:var(--muted);font-size:.8rem;line-height:1.35}
.badge.off{opacity:.42;filter:grayscale(1)}
.result .badges{display:flex;flex-wrap:wrap;justify-content:center}
.result .badge{width:170px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:42px;flex-wrap:wrap}
.section-title h2{font-size:1.5rem}

/* Topbar in missions / exam */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,rgba(5,11,20,.97),rgba(5,11,20,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .title{display:flex;flex-direction:column;min-width:0;flex:1}
.topbar .title small{font:600 .72rem var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.topbar .title b{font-family:var(--font-display);font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:5px;width:100%;order:5}
.segs i{flex:1;height:8px;border-radius:3px;background:var(--panel-3)}
.segs i.cur{background:var(--blue);box-shadow:0 0 10px var(--blue)}
.segs i.ok{background:var(--green)}
.segs i.half{background:var(--amber)}
.segs i.miss{background:var(--red)}

/* Lesson / briefing */
.brief{max-width:900px;margin:28px auto 0;display:flex;flex-direction:column;gap:20px}
.brief h2{font-size:clamp(1.6rem,3.6vw,2.2rem)}
.prose{display:flex;flex-direction:column;gap:12px;font-size:1.08rem}
.prose>p,.prose>ul{max-width:68ch}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.prose strong{color:var(--cyan)}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--panel-3)}
.dots i.on{background:var(--cyan)}
.mistakes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.mistake{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mistake .bad,.mistake .good{font:400 .86rem/1.5 var(--font-mono);overflow-x:auto;white-space:pre}
.mistake .bad{color:var(--red)}
.mistake .good{color:var(--green)}
.mistake small{color:var(--muted);font-size:.86rem}
.optable{width:100%;border-collapse:collapse;font-size:.98rem}
.optable th,.optable td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left}
.optable th{font:600 .75rem var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.optable td:first-child{font-family:var(--font-mono);color:var(--cyan);font-weight:700}
.optable td.t{color:var(--green);font-family:var(--font-mono)}
.optable td.f{color:var(--red);font-family:var(--font-mono)}
.table-scroll{overflow-x:auto}
.runner{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg-2));border-radius:var(--r);padding:16px}
.runner-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.vary{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vary .lbl{font-size:.9rem;color:var(--muted)}
.chipbtn{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font:600 .95rem var(--font-mono);cursor:pointer;color:var(--text)}
.chipbtn.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-a)}
.broken-tag{font:600 .72rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--red);border:1px solid rgba(255,93,125,.5);padding:3px 9px;border-radius:999px}

/* Code view */
.code{background:#02070d;border:1px solid var(--line);border-radius:var(--r-sm);overflow-x:auto;font:400 1rem/1.7 var(--font-mono);padding:8px 0;counter-reset:ln}
.code .cl{display:flex;min-width:max-content;padding-right:16px;position:relative;border-left:3px solid transparent;transition:background .2s ease,opacity .2s ease}
.code .cl::before{counter-increment:ln;content:counter(ln);width:2.6em;padding-right:.9em;text-align:right;color:var(--dim);flex:none;user-select:none}
.code .cl .src{white-space:pre}
.code .cl.run{border-left-color:var(--green);background:rgba(67,245,165,.06)}
.code .cl.skip{opacity:.42}
.code .cl.cur{background:rgba(41,230,255,.14);border-left-color:var(--cyan)}
.code .cl.errline{background:var(--red-a);border-left-color:var(--red)}
button.cl{width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;font:inherit;color:inherit;cursor:pointer;padding-block:3px;min-height:40px;align-items:center}
button.cl:hover{background:var(--blue-a)}
button.cl.sel{background:var(--cyan-a);border-left-color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(41,230,255,.35)}
button.cl.ok{background:var(--green-a);border-left-color:var(--green)}
button.cl.bad{background:var(--red-a);border-left-color:var(--red)}
button.cl[disabled]{cursor:default}
.t-kw{color:var(--t-kw);font-weight:700}.t-fn{color:var(--t-fn)}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-com{color:var(--t-com);font-style:italic}.t-op{color:var(--t-op)}.t-id{color:var(--t-id)}
.inputs-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.95rem;color:var(--muted)}

/* Challenge */
.stage{max-width:900px;margin:22px auto 0;display:flex;flex-direction:column;gap:16px}
.qcard{position:relative;border:1px solid var(--line-2);background:linear-gradient(180deg,var(--panel),var(--bg-2));border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px -30px rgba(0,0,0,.8)}
.qcard.enter{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.45;transform:translateY(12px)}to{opacity:1;transform:none}}
.qcard.follow{border-color:rgba(255,204,77,.45)}
.qcard.reinf{border-color:rgba(63,140,255,.6)}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.kind{font:700 .76rem var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);background:var(--cyan-a);border:1px solid rgba(41,230,255,.3);padding:4px 10px;border-radius:999px}
.qcard.follow .kind{color:var(--amber);background:var(--amber-a);border-color:rgba(255,204,77,.4)}
.qcard.reinf .kind{color:var(--blue);background:var(--blue-a);border-color:rgba(63,140,255,.45)}
.diff{display:inline-flex;gap:3px;margin-left:auto;align-items:center;font-size:.75rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.diff i{width:9px;height:9px;border-radius:2px;background:var(--panel-3);transform:rotate(45deg)}
.diff i.on{background:var(--cyan)}
.qnum{font:700 .8rem var(--font-mono);color:var(--muted)}
.qtext{font-family:var(--font-body);font-weight:700;font-size:clamp(1.12rem,2.3vw,1.32rem);line-height:1.4;letter-spacing:0}
.qtext code{white-space:normal}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;min-height:60px;padding:14px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .12s ease;min-width:0}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--panel-3)}
.opt .key{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);font:700 .85rem var(--font-mono);color:var(--muted)}
.opt .txt{flex:1;min-width:0;font-size:1.04rem;padding-top:2px;overflow-wrap:anywhere}
.opt .txt.mono{font:400 .98rem/1.6 var(--font-mono);white-space:pre-wrap;overflow-x:auto;overflow-wrap:normal}
.opt .txt.code-out{color:var(--green)}
.opt.picked{border-color:var(--cyan);background:var(--cyan-a);box-shadow:0 0 0 1px rgba(41,230,255,.4)}
.opt.picked .key{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.opt.right{border-color:var(--green);background:var(--green-a)}
.opt.right .key{background:var(--green);color:var(--ink);border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-a)}
.opt.wrong .key{background:var(--red);color:var(--ink);border-color:var(--red)}
.opt[disabled]{cursor:default}
.type-in{width:100%;min-height:96px;resize:vertical;border-radius:12px;border:1px solid var(--line-2);background:#02070d;color:var(--green);padding:12px 14px;font:400 1rem/1.6 var(--font-mono)}
.type-in:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-a)}
.type-in[readonly]{opacity:.85}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:4.2ch;height:1.6em;vertical-align:baseline;margin:0 1px;padding:0 6px;border-radius:6px;border:1px dashed var(--amber);background:var(--amber-a);color:var(--amber);font:700 1em var(--font-mono);cursor:pointer}
.blank.focus{border-style:solid;box-shadow:0 0 0 2px rgba(255,204,77,.4)}
.blank.filled{border-style:solid;border-color:var(--cyan);color:var(--cyan);background:var(--cyan-a)}
.blank.ok{border-color:var(--green);color:var(--green);background:var(--green-a)}
.blank.bad{border-color:var(--red);color:var(--red);background:var(--red-a)}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:48px;min-width:56px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font:700 1.02rem var(--font-mono);color:var(--text);cursor:pointer;white-space:pre}
.chip:hover:not([disabled]){border-color:var(--cyan);color:var(--cyan)}
.chip[disabled]{opacity:.5;cursor:default}
.subhead{font:600 .74rem var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ord-area{display:flex;flex-direction:column;gap:8px;min-height:60px;border:1px dashed var(--line-2);border-radius:12px;padding:10px;background:#02070d}
.ord-area.pool{background:var(--bg-2)}
.ord-line{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:46px;padding:6px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;font:400 .98rem var(--font-mono);overflow-x:auto}
.ord-line .n{flex:none;width:1.8em;color:var(--dim);font-size:.8rem}
.ord-line .src{white-space:pre}
.ord-line:hover:not([disabled]){border-color:var(--cyan)}
.ord-line[disabled]{cursor:default}
.ord-empty{color:var(--dim);font-size:.92rem;padding:8px}
.chain{display:flex;flex-direction:column;gap:8px}
.chain .fixed{font:400 1rem var(--font-mono);padding:6px 12px;color:var(--muted);white-space:pre;overflow-x:auto}
.cblock{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:10px;padding:8px 8px 8px 12px}
.cblock pre{margin:0;flex:1;min-width:0;font:400 1rem/1.6 var(--font-mono);white-space:pre;overflow-x:auto}
.cblock .mv{display:flex;flex-direction:column;gap:4px}
.cblock .mv button{width:42px;height:34px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;color:var(--cyan);display:grid;place-items:center}
.cblock .mv button[disabled]{opacity:.3;cursor:default}
.spec{width:100%;border-collapse:collapse;font-size:.96rem}
.spec th,.spec td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.spec th{font:600 .72rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.spec td{font-family:var(--font-mono)}
.spec td.ok{color:var(--green)}.spec td.bad{color:var(--red)}
.trow{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .lbl{font:700 1rem var(--font-mono);color:var(--amber)}
.trow .choices{display:flex;flex-wrap:wrap;gap:8px}
.tchoice{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font:400 .95rem var(--font-mono);cursor:pointer;color:var(--text)}
.tchoice.picked{border-color:var(--cyan);background:var(--cyan-a);color:var(--cyan)}
.tchoice.right{border-color:var(--green);background:var(--green-a);color:var(--green)}
.tchoice.wrong{border-color:var(--red);background:var(--red-a);color:var(--red)}
.tchoice[disabled]{cursor:default}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;padding:6px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;font:700 1rem var(--font-mono);color:var(--text);text-align:left;overflow-wrap:anywhere}
.mitem.active{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan-a)}
.mitem .tagn{flex:none;display:grid;place-items:center;min-width:26px;height:26px;border-radius:7px;font-size:.8rem;color:var(--ink)}
.mitem.ok{border-color:var(--green)}.mitem.bad{border-color:var(--red)}
.mitem[disabled]{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end}
.actions .grow{margin-right:auto}
.hint-box{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(255,204,77,.4);background:var(--amber-a);color:var(--text);border-radius:12px;padding:12px 14px}
.hint-box .ic{color:var(--amber);margin-top:3px}

/* Feedback */
.fb{border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line-2);background:var(--panel)}
.fb.ok{border-color:rgba(67,245,165,.55);background:linear-gradient(180deg,rgba(67,245,165,.1),var(--panel))}
.fb.bad{border-color:rgba(255,93,125,.55);background:linear-gradient(180deg,rgba(255,93,125,.1),var(--panel))}
.fb.half{border-color:rgba(255,204,77,.55);background:linear-gradient(180deg,rgba(255,204,77,.1),var(--panel))}
.fb:focus{outline:none}
.fb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.fb-head .big{font-family:var(--font-display);font-size:1.3rem;font-weight:700}
.fb.ok .fb-head .big,.fb.ok .fb-head .ic{color:var(--green)}
.fb.bad .fb-head .big,.fb.bad .fb-head .ic{color:var(--red)}
.fb.half .fb-head .big,.fb.half .fb-head .ic{color:var(--amber)}
.xpgain{font:700 .9rem var(--font-display);color:var(--cyan);border:1px solid rgba(41,230,255,.4);border-radius:999px;padding:2px 10px;animation:pop .4s ease}
.streakgain{font:700 .9rem var(--font-display);color:var(--amber);border:1px solid rgba(255,204,77,.4);border-radius:999px;padding:2px 10px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.fb p{max-width:72ch}
.fb .why{border-left:3px solid var(--red);padding-left:12px}
.fb .why b{color:var(--red)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:st}
.steps li{display:flex;gap:10px;font-size:.98rem;align-items:baseline}
.steps li::before{counter-increment:st;content:counter(st);flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--panel-3);font:700 .78rem var(--font-mono);color:var(--cyan)}
.steps li .ln{font:700 .8rem var(--font-mono);color:var(--dim);flex:none}
.steps code,.trace-text code{white-space:normal}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pyerr{font:400 .95rem/1.55 var(--font-mono);color:var(--red);background:#02070d;border:1px solid rgba(255,93,125,.4);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.pyerr .h{display:block;color:var(--amber);font-family:var(--font-body);margin-top:4px}

/* Boss */
.boss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;border:1px solid rgba(255,93,125,.45);background:linear-gradient(90deg,rgba(255,93,125,.12),var(--panel));border-radius:16px;padding:12px 16px}
.boss svg{width:74px;height:74px;filter:drop-shadow(0 0 12px rgba(255,93,125,.55))}
.boss.hit svg{animation:shake .45s ease}
.boss.dead svg{opacity:.35;filter:grayscale(1)}
.boss .name{font-family:var(--font-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.boss .say{color:var(--muted);font-size:.92rem}
.hp{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.hp i{height:10px;border-radius:2px;background:var(--red);box-shadow:0 0 8px rgba(255,93,125,.6);transition:background .3s ease}
.hp i.half{background:linear-gradient(90deg,var(--red) 50%,var(--panel-3) 50%)}
.hp i.gone{background:var(--panel-3);box-shadow:none}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.glitch-eye{animation:eye 3s steps(1) infinite}
@keyframes eye{0%,92%{opacity:1}93%,96%{opacity:.2}}

/* Results */
.result{max-width:820px;margin:36px auto 0;display:flex;flex-direction:column;gap:22px;text-align:center;align-items:center}
.result h1{font-size:clamp(2rem,5vw,3rem)}
.result .stars .ic{width:3.2rem;height:3.2rem}
.result .stars .ic.on{animation:starIn .5s cubic-bezier(.3,1.6,.5,1) backwards}
.result .stars .ic:nth-child(2){animation-delay:.18s}.result .stars .ic:nth-child(3){animation-delay:.36s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.stat{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat b{font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.recap{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.recap-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.recap-row .mk{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:700}
.recap-row .mk.ok{background:var(--green-a);color:var(--green)}.recap-row .mk.half{background:var(--amber-a);color:var(--amber)}.recap-row .mk.miss{background:var(--red-a);color:var(--red)}
.recap-row small{color:var(--muted)}
.ring{width:180px;height:180px}
.ring text{font-family:var(--font-display);font-weight:700}

/* Exam */
.timer{font:700 1.25rem var(--font-mono);font-variant-numeric:tabular-nums;color:var(--cyan);display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:10px;border:1px solid rgba(41,230,255,.4);background:var(--cyan-a)}
.timer.warn{color:var(--amber);border-color:rgba(255,204,77,.5);background:var(--amber-a)}
.timer.crit{color:var(--red);border-color:rgba(255,93,125,.6);background:var(--red-a);animation:blink 1s steps(1) infinite}
.palette{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:6px}
.palette button{height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);font:700 .9rem var(--font-mono);color:var(--muted);cursor:pointer;position:relative;padding:0}
.palette button.ans{background:var(--blue-a);color:var(--text);border-color:var(--blue)}
.palette button.cur{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 2px var(--cyan-a)}
.palette button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.palette button.ok{background:var(--green-a);border-color:var(--green);color:var(--green)}
.palette button.bad{background:var(--red-a);border-color:var(--red);color:var(--red)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.rule{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.rule b{font-family:var(--font-display);font-size:1.15rem}
.rule span{color:var(--muted);font-size:.94rem}
.review details{border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.review details+details{margin-top:10px}
.review summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
.review summary::-webkit-details-marker{display:none}
.review summary .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review summary small{color:var(--muted)}
.review .body{padding:0 14px 14px}
.review .qcard{box-shadow:none}

/* Report */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 56px;gap:14px;align-items:center}
.bar-row .nm{font-family:var(--font-display);font-weight:600}
.bar-row .nm small{display:block;color:var(--muted);font-family:var(--font-body);font-weight:400;font-size:.8rem}
.bar{height:14px;border-radius:7px;background:var(--panel-3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:7px}
.bar-row .pc{font:700 1rem var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h3{font-size:1.15rem}
.box ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.slip{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.slip:last-child{border-bottom:0}
.slip b{font-family:var(--font-display)}
.slip small{display:block;color:var(--muted)}
.slip .cnt{font:700 .95rem var(--font-mono);color:var(--amber);white-space:nowrap}

/* Code lab */
.lab-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-top:18px}
.editor{display:flex;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#02070d;overflow:hidden;min-height:320px}
.editor .gut{flex:none;width:3em;padding:12px .7em 12px 0;text-align:right;color:var(--dim);font:400 1rem/1.6 var(--font-mono);user-select:none;overflow:hidden;white-space:pre;background:var(--bg-2)}
.editor textarea{flex:1;min-width:0;border:0;outline:none;resize:none;background:transparent;color:var(--text);font:400 1rem/1.6 var(--font-mono);padding:12px 14px;white-space:pre;overflow:auto;tab-size:4}
.editor:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-a)}
.term.lab{min-height:320px;max-height:520px;overflow:auto}
.term-in{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.term-in input{flex:1;min-width:120px;background:transparent;border:0;border-bottom:1px dashed var(--cyan);color:var(--cyan);font:inherit;outline:none;padding:2px 4px}
select.input{font-family:var(--font-body);font-weight:400;cursor:pointer}

/* Modal + toast */
#modal-root .overlay{position:fixed;inset:0;z-index:60;background:var(--shade);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal-root .overlay.fresh{animation:fade .2s ease}
@keyframes fade{from{opacity:.4}}
.modal{width:min(100%,560px);max-height:100%;overflow:auto;border:1px solid var(--line-2);background:var(--panel);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px -20px #000}
.modal.wide{width:min(100%,1040px)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h3{font-size:1.3rem}
.trace-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.trace-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.trace-step{border:1px solid rgba(41,230,255,.4);background:var(--cyan-a);border-radius:12px;padding:12px 14px;min-height:96px}
.trace-step .n{font:700 .74rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.trace-step.err{border-color:rgba(255,93,125,.5);background:var(--red-a)}
.trace-step.err .n{color:var(--red)}
.trace-text{margin-top:6px;font-size:1.02rem}
.vars{width:100%;border-collapse:collapse;font-size:.95rem}
.vars td,.vars th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.vars th{font:600 .7rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vars td{font-family:var(--font-mono)}
.vars td.v{color:var(--amber)}
.vars td.ty{color:var(--dim);font-size:.82rem}
.vars tr.changed td{background:var(--amber-a)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle small{display:block;color:var(--muted)}
.switch{position:relative;width:56px;height:32px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-3);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s ease,background .2s ease}
.switch[aria-checked="true"]{background:var(--cyan-a);border-color:var(--cyan)}
.switch[aria-checked="true"]::after{transform:translateX(24px);background:var(--cyan)}
#toast-root{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel-2);box-shadow:0 18px 40px -16px #000;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);width:100%}
.toast.badge-t{border-color:rgba(255,204,77,.6)}
.toast svg.hex{width:40px;height:44px;flex:none}
.toast b{font-family:var(--font-display)}
.toast small{display:block;color:var(--muted)}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{transform:translateY(20px) scale(.96);opacity:0}}
@keyframes toastOut{to{transform:translateY(12px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:65}
.flash-bad{animation:flashBad .4s ease}
@keyframes flashBad{30%{box-shadow:0 0 0 2px var(--red),0 0 40px -6px var(--red)}}

/* Responsive */
@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .lab-grid,.trace-grid{grid-template-columns:minmax(0,1fr)}
  .spine::before{left:26px}
  .stop{grid-template-columns:52px minmax(0,1fr);gap:14px}
  .stop .node{grid-column:1;width:44px;height:44px;font-size:1rem}
  .stop.l .mcard,.stop.r .mcard{grid-column:2}
}
@media (max-width:640px){
  body{font-size:16px}
  .hud-rank{display:none}
  .hide-sm{display:none}
  .hud-in{gap:8px}
  .hud-stats{gap:6px}
  .icon-btn{width:40px;height:40px;border-radius:10px}
  .brand-name{font-size:1rem}
  .pill{height:34px;padding:0 9px}
  .pill span{display:none}
  .opts{grid-template-columns:minmax(0,1fr)}
  .qcard{padding:16px;border-radius:14px}
  .code{font-size:.9rem}
  .rooms-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rooms-strip div:last-child{grid-column:1/-1}
  .lab-progress{grid-template-columns:minmax(0,1fr) auto}
  .lab-progress .pbar{grid-column:1/-1;grid-row:2}
  .palette{grid-template-columns:repeat(8,minmax(0,1fr))}
  .compare,.cols2,.match{grid-template-columns:minmax(0,1fr)}
  .bar-row{grid-template-columns:minmax(0,1fr) 52px}
  .bar-row .bar{grid-column:1/-1;grid-row:2}
  .actions .btn{flex:1}
  .actions .grow{margin-right:0;flex-basis:100%}
  .trow{grid-template-columns:minmax(0,1fr)}
  .mcard .in{padding:16px}
  .modal{padding:16px}
}
@media (max-width:480px){
  .brand-name{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

<body>
<div class="grid-bg" aria-hidden="true"></div>
<main id="app"></main>
<div id="sr" class="sr" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<noscript><p style="padding:24px">Python Quest needs JavaScript to run. Please enable JavaScript in your browser.</p></noscript>
<script id="pq-core">
"use strict";
/* =====================================================================
   PyLite — a tiny, safe Python interpreter (no eval). It supports the
   subset taught in Python Quest: print(), input(), variables, arithmetic,
   comparisons, if / elif / else, int(), float(), str(), len() and a few
   string methods. It reports Python-style errors and records a step-by-
   step trace used for explanations.
   ===================================================================== */
const PyLite = (() => {
  class PyErr extends Error {
    constructor(type, msg, line, hint) { super(type + ': ' + msg); this.type = type; this.msg = msg; this.line = line; this.hint = hint || ''; }
  }
  const KEYWORDS = new Set(['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
  const UNSUPPORTED = new Set(['while','for','def','return','import','from','class','try','except','finally','with','lambda','global','nonlocal','del','yield','assert','raise','break','continue','async','await']);
  const BUILTINS = new Set(['print','input','int','float','str','len','abs','round','max','min','type','bool']);
  const ASSIGN_OPS = ['=','+=','-=','*=','/=','//=','%='];

  /* ---------- values ---------- */
  const NONE = { t: 'none' };
  const V = { int: v => ({ t: 'int', v }), float: v => ({ t: 'float', v }), str: v => ({ t: 'str', v }), bool: v => ({ t: 'bool', v }) };
  const tname = x => x.t === 'none' ? 'NoneType' : x.t === 'fn' ? 'builtin_function_or_method' : x.t;
  function fmtFloat(v) {
    if (Number.isNaN(v)) return 'nan';
    if (!Number.isFinite(v)) return v > 0 ? 'inf' : '-inf';
    if (Number.isInteger(v) && Math.abs(v) < 1e16) return v.toFixed(1);
    return String(v).replace(/e([+-])(\d)$/, 'e$10$2');
  }
  function toStr(x) {
    switch (x.t) {
      case 'str': return x.v;
      case 'int': return String(x.v);
      case 'float': return fmtFloat(x.v);
      case 'bool': return x.v ? 'True' : 'False';
      case 'none': return 'None';
      case 'type': return "<class '" + x.v + "'>";
      case 'fn': return '<built-in function ' + x.v + '>';
    }
    return '?';
  }
  function pyRepr(s) {
    const q = s.includes("'") && !s.includes('"') ? '"' : "'";
    return q + s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\t/g, '\\t').split(q).join('\\' + q) + q;
  }
  // How values are shown in the variables panel / explanations
  const show = x => x.t === 'str' ? '"' + x.v.replace(/\n/g, '\\n') + '"' : toStr(x);
  function truthy(x) {
    switch (x.t) { case 'bool': return x.v; case 'int': case 'float': return x.v !== 0; case 'str': return x.v.length > 0; case 'none': return false; }
    return true;
  }
  const isNum = x => x.t === 'int' || x.t === 'float' || x.t === 'bool';
  const nv = x => x.t === 'bool' ? (x.v ? 1 : 0) : x.v;

  /* ---------- tokenizer (one physical line at a time) ---------- */
  function tokenize(line, ln) {
    const toks = []; let i = 0; const n = line.length;
    while (i < n) {
      const ch = line[i];
      if (ch === ' ' || ch === '\t') { i++; continue; }
      if (ch === '#') break;
      let isF = false, j = i;
      if ((ch === 'f' || ch === 'F') && (line[i + 1] === '"' || line[i + 1] === "'")) { isF = true; j = i + 1; }
      const q = line[j];
      if (q === '"' || q === "'") {
        let k = j + 1, s = '';
        while (k < n && line[k] !== q) {
          if (line[k] === '\\' && k + 1 < n) {
            const e = line[k + 1];
            s += e === 'n' ? '\n' : e === 't' ? '\t' : e === '\\' ? '\\' : e === "'" ? "'" : e === '"' ? '"' : '\\' + e;
            k += 2; continue;
          }
          s += line[k]; k++;
        }
        if (k >= n) throw new PyErr('SyntaxError', 'unterminated string literal (detected at line ' + ln + ')', ln,
          'Text (a string) must start and end with the same kind of quotation mark, e.g. "Hello".');
        toks.push({ t: isF ? 'fstr' : 'str', v: s, c: i }); i = k + 1; continue;
      }
      if (/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(line[i + 1] || ''))) {
        const txt = /^(\d+\.\d*|\.\d+|\d+)([eE][+-]?\d+)?/.exec(line.slice(i))[0];
        const k = i + txt.length;
        if (k < n && /[A-Za-z_]/.test(line[k])) throw new PyErr('SyntaxError', 'invalid decimal literal', ln, 'A variable name cannot start with a number. Try a name like player2.');
        toks.push({ t: 'num', v: Number(txt), f: /[.eE]/.test(txt), c: i }); i = k; continue;
      }
      if (/[A-Za-z_]/.test(ch)) {
        const m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(line.slice(i))[0];
        toks.push({ t: 'name', v: m, c: i }); i += m.length; continue;
      }
      const three = line.substr(i, 3), two = line.substr(i, 2);
      if (three === '//=' || three === '**=') { toks.push({ t: 'op', v: three, c: i }); i += 3; continue; }
      if (['**','//','==','!=','<=','>=','+=','-=','*=','/=','%=','=>','=<'].includes(two)) { toks.push({ t: 'op', v: two, c: i }); i += 2; continue; }
      if ('+-*/%()=<>,:.'.includes(ch)) { toks.push({ t: 'op', v: ch, c: i }); i++; continue; }
      if ('“”‘’'.includes(ch)) throw new PyErr('SyntaxError', "invalid character '" + ch + "' (U+" + ch.charCodeAt(0).toString(16).toUpperCase().padStart(4, '0') + ')', ln,
        'Use straight quotation marks " or \'. Curly quotes from a word processor do not work in Python.');
      if ('[]{}'.includes(ch)) throw new PyErr('LabError', 'lists and dictionaries are not part of this lab', ln, 'Python Quest covers print(), input(), variables and if / elif / else.');
      throw new PyErr('SyntaxError', 'invalid syntax', ln);
    }
    let depth = 0;
    for (const t of toks) {
      if (t.t === 'op' && t.v === '(') depth++;
      else if (t.t === 'op' && t.v === ')') { depth--; if (depth < 0) throw new PyErr('SyntaxError', "unmatched ')'", ln, 'There is a closing bracket ) without a matching opening bracket (.'); }
    }
    if (depth > 0) throw new PyErr('SyntaxError', "'(' was never closed", ln, 'Every opening bracket ( needs a closing bracket ).');
    return toks;
  }

  /* ---------- expression parser ---------- */
  class P {
    constructor(t, ln) { this.t = t; this.i = 0; this.ln = ln; }
    peek() { return this.t[this.i]; }
    eof() { return this.i >= this.t.length; }
    isOp(v) { const k = this.t[this.i]; return !!k && k.t === 'op' && k.v === v; }
    isName(v) { const k = this.t[this.i]; return !!k && k.t === 'name' && k.v === v; }
    fail(msg, hint) { throw new PyErr('SyntaxError', msg || 'invalid syntax', this.ln, hint); }
    expr() { return this.or(); }
    or() { let l = this.and(); while (this.isName('or')) { this.i++; l = { k: 'bool', op: 'or', l, r: this.and() }; } return l; }
    and() { let l = this.not(); while (this.isName('and')) { this.i++; l = { k: 'bool', op: 'and', l, r: this.not() }; } return l; }
    not() { if (this.isName('not')) { this.i++; return { k: 'not', e: this.not() }; } return this.cmp(); }
    cmp() {
      const items = [this.add()], ops = [];
      for (;;) {
        const k = this.peek();
        if (k && k.t === 'op' && ['<','>','==','!=','<=','>='].includes(k.v)) { this.i++; ops.push(k.v); items.push(this.add()); }
        else if (k && k.t === 'op' && (k.v === '=>' || k.v === '=<')) this.fail('invalid syntax', 'Python writes this operator as ' + (k.v === '=>' ? '>=' : '<=') + ' (the = sign goes second).');
        else break;
      }
      return ops.length ? { k: 'cmp', ops, items } : items[0];
    }
    add() { let l = this.mul(); while (this.isOp('+') || this.isOp('-')) { const op = this.t[this.i++].v; l = { k: 'bin', op, l, r: this.mul() }; } return l; }
    mul() { let l = this.unary(); while (['*','/','//','%'].some(o => this.isOp(o))) { const op = this.t[this.i++].v; l = { k: 'bin', op, l, r: this.unary() }; } return l; }
    unary() { if (this.isOp('-') || this.isOp('+')) { const op = this.t[this.i++].v; return { k: 'neg', op, e: this.unary() }; } return this.pow(); }
    pow() { const b = this.postfix(); if (this.isOp('**')) { this.i++; return { k: 'bin', op: '**', l: b, r: this.unary() }; } return b; }
    postfix() {
      let e = this.atom();
      for (;;) {
        if (this.isOp('(')) e = this.call(e);
        else if (this.isOp('.')) { this.i++; const k = this.peek(); if (!k || k.t !== 'name') this.fail(); this.i++; e = { k: 'attr', obj: e, name: k.v }; }
        else break;
      }
      return e;
    }
    call(fn) {
      this.i++;
      const args = [], kw = [];
      if (!this.isOp(')')) {
        for (;;) {
          const k = this.peek(), k2 = this.t[this.i + 1];
          if (k && k.t === 'name' && k2 && k2.t === 'op' && k2.v === '=') { this.i += 2; kw.push([k.v, this.expr()]); }
          else args.push(this.expr());
          if (this.isOp(',')) { this.i++; if (this.isOp(')')) break; continue; }
          if (this.isOp(')')) break;
          const nx = this.peek();
          if (nx && nx.t === 'op' && nx.v === '=') this.fail("invalid syntax. Maybe you meant '==' or ':=' instead of '='?", 'Use == to compare two values.');
          this.fail('invalid syntax. Perhaps you forgot a comma?', 'Separate the items inside the brackets with commas.');
        }
      }
      this.i++;
      return { k: 'call', fn, args, kw };
    }
    atom() {
      const k = this.peek();
      if (!k) this.fail();
      if (k.t === 'num') { this.i++; return { k: 'num', v: k.v, f: k.f }; }
      if (k.t === 'str' || k.t === 'fstr') {
        const parts = [];
        while (this.peek() && (this.peek().t === 'str' || this.peek().t === 'fstr')) {
          const s = this.t[this.i++];
          parts.push(s.t === 'str' ? { k: 'str', v: s.v } : parseF(s.v, this.ln));
        }
        if (parts.length === 1) return parts[0];
        return { k: 'fstr', parts: parts.flatMap(p => p.k === 'str' ? [p.v] : p.parts), src: null };
      }
      if (k.t === 'name') {
        if (k.v === 'True' || k.v === 'False' || k.v === 'None') { this.i++; return { k: 'const', v: k.v === 'True' ? true : k.v === 'False' ? false : null }; }
        if (KEYWORDS.has(k.v)) this.fail();
        this.i++; return { k: 'name', id: k.v };
      }
      if (k.t === 'op' && k.v === '(') { this.i++; const e = this.expr(); if (!this.isOp(')')) this.fail(); this.i++; return { k: 'paren', e }; }
      this.fail();
    }
  }
  function parseExprTokens(toks, ln) {
    const p = new P(toks, ln);
    const e = p.expr();
    if (!p.eof()) p.fail();
    return e;
  }
  function parseF(raw, ln) {
    const parts = []; let i = 0, buf = '';
    while (i < raw.length) {
      const c = raw[i];
      if (c === '{') {
        if (raw[i + 1] === '{') { buf += '{'; i += 2; continue; }
        let j = i + 1; while (j < raw.length && raw[j] !== '}') j++;
        if (j >= raw.length) throw new PyErr('SyntaxError', "f-string: expecting '}'", ln);
        let inner = raw.slice(i + 1, j), spec = '';
        const ci = inner.indexOf(':'); if (ci >= 0) { spec = inner.slice(ci + 1); inner = inner.slice(0, ci); }
        if (buf) { parts.push(buf); buf = ''; }
        parts.push({ e: parseExprTokens(tokenize(inner, ln), ln), spec });
        i = j + 1; continue;
      }
      if (c === '}') { if (raw[i + 1] === '}') { buf += '}'; i += 2; continue; } throw new PyErr('SyntaxError', "f-string: single '}' is not allowed", ln); }
      buf += c; i++;
    }
    if (buf) parts.push(buf);
    return { k: 'fstr', parts };
  }

  /* ---------- statement / block parser ---------- */
  const isNameTok = (t, v) => !!t && t.t === 'name' && t.v === v;
  function topIndex(toks, pred) {
    let d = 0;
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t.t === 'op' && t.v === '(') d++;
      else if (t.t === 'op' && t.v === ')') d--;
      else if (d === 0 && pred(t)) return i;
    }
    return -1;
  }
  function header(l, kw) {
    const t = l.toks;
    const ci = topIndex(t, x => x.t === 'op' && x.v === ':');
    if (ci < 0) {
      if (kw === 'else' && isNameTok(t[1], 'if')) throw new PyErr('SyntaxError', "expected ':'", l.ln, 'Python does not use "else if". Write elif instead, e.g. elif score >= 50:');
      throw new PyErr('SyntaxError', "expected ':'", l.ln, 'Put a colon : at the end of the ' + kw + ' line.');
    }
    const ct = t.slice(1, ci), rest = t.slice(ci + 1);
    if (kw === 'else') {
      if (ct.length) {
        if (isNameTok(ct[0], 'if')) throw new PyErr('SyntaxError', "expected ':'", l.ln, 'Python does not use "else if". Write elif instead, e.g. elif score >= 50:');
        throw new PyErr('SyntaxError', "expected ':'", l.ln, 'else never has a condition. Write just  else:  (or use elif with a condition).');
      }
      return { cond: null, rest };
    }
    if (!ct.length) throw new PyErr('SyntaxError', 'invalid syntax', l.ln, kw + ' needs a condition, e.g. ' + kw + ' score >= 50:');
    if (topIndex(ct, x => x.t === 'op' && x.v === '=') >= 0) throw new PyErr('SyntaxError', "invalid syntax. Maybe you meant '==' or ':=' instead of '='?", l.ln, 'Use == to compare two values. A single = stores a value in a variable.');
    return { cond: parseExprTokens(ct, l.ln), rest };
  }
  function simple(toks, ln) {
    const t = toks, f = t[0];
    if (f.t === 'name' && UNSUPPORTED.has(f.v)) throw new PyErr('LabError', "'" + f.v + "' is not part of this lab", ln, 'Python Quest covers print(), input(), variables and if / elif / else.');
    if (isNameTok(f, 'pass') && t.length === 1) return { k: 'pass', line: ln };
    if (isNameTok(f, 'print') && t[1] && (t[1].t === 'str' || t[1].t === 'name' || t[1].t === 'num' || t[1].t === 'fstr'))
      throw new PyErr('SyntaxError', "Missing parentheses in call to 'print'. Did you mean print(...)?", ln, 'In Python 3, print always needs brackets: print("Hello")');
    const ai = topIndex(t, x => x.t === 'op' && ASSIGN_OPS.includes(x.v));
    if (ai >= 0) {
      const lhs = t.slice(0, ai), op = t[ai].v, rhs = t.slice(ai + 1);
      if (lhs.length === 1 && lhs[0].t === 'name' && !KEYWORDS.has(lhs[0].v)) {
        if (!rhs.length) throw new PyErr('SyntaxError', 'invalid syntax', ln, 'Put a value after the = sign.');
        if (topIndex(rhs, x => x.t === 'op' && ASSIGN_OPS.includes(x.v)) >= 0) throw new PyErr('SyntaxError', 'invalid syntax', ln);
        return { k: 'assign', name: lhs[0].v, op, e: parseExprTokens(rhs, ln), rhsToks: rhs, line: ln };
      }
      if (lhs.length === 1 && (lhs[0].t === 'str' || lhs[0].t === 'num' || lhs[0].t === 'fstr'))
        throw new PyErr('SyntaxError', "cannot assign to literal here. Maybe you meant '==' instead of '='?", ln, 'The variable name goes on the left of = without quotation marks.');
      if (lhs.length === 1 && lhs[0].t === 'name') {
        if (['True','False','None'].includes(lhs[0].v)) throw new PyErr('SyntaxError', 'cannot assign to ' + lhs[0].v, ln);
        throw new PyErr('SyntaxError', 'invalid syntax', ln, "'" + lhs[0].v + "' is a Python keyword and cannot be used as a variable name.");
      }
      if (lhs.some(x => x.t === 'op' && x.v === '(')) throw new PyErr('SyntaxError', "cannot assign to function call here. Maybe you meant '==' instead of '='?", ln, 'The left side of = must be a variable name.');
      if (lhs.some(x => x.t === 'op')) throw new PyErr('SyntaxError', "cannot assign to expression here. Maybe you meant '==' instead of '='?", ln, 'Variable names can only use letters, digits and underscores _.');
      throw new PyErr('SyntaxError', 'invalid syntax', ln, 'Variable names cannot contain spaces. Use an underscore instead, like player_name.');
    }
    return { k: 'expr', e: parseExprTokens(t, ln), line: ln };
  }
  function parseBlock(L, i, ind, stack) {
    const out = [];
    while (i < L.length) {
      const l = L[i];
      if (l.ind < ind) {
        if (!stack.includes(l.ind)) throw new PyErr('IndentationError', 'unindent does not match any outer indentation level', l.ln, 'Line this line up exactly with the if / elif / else it belongs to.');
        break;
      }
      if (l.ind > ind) throw new PyErr('IndentationError', 'unexpected indent', l.ln, 'Only the lines inside an if, elif or else block should be indented.');
      const f = l.toks[0];
      if (isNameTok(f, 'if')) {
        const node = { k: 'if', line: l.ln, branches: [], orelse: null };
        let h = header(l, 'if'), body;

          step(ctx, nextLine, 'skip', 'A block in this chain has already run, so Python skips the rest of the if / elif / else chain without checking it.');

          step(ctx, s.line, 'skip', 'No condition was True and there is no else, so nothing in this block runs.');
        }
      }
    }
  }
  function newCtx() {

  }

  function run(code, inputs) {

      if (!(e instanceof PyErr)) throw e;

    }

  }
  // Interactive session (Code Lab): step() runs until the next input() or the end.
  function session(code) {
    const ctx = newCtx();
    let it = null, error = null;
    try { it = execBlock(parseProgram(code), ctx); } catch (e) { if (!(e instanceof PyErr)) throw e; error = errObj(e); }
    return {
      ctx,

/* ---------- display highlighter (tolerant of broken code) ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const HL_KW = new Set(['if','elif','else','and','or','not','in','is','while','for','def','return','import','pass']);
const HL_CONST = new Set(['True','False','None']);
const HL_FN = new Set(['print','input','int','float','str','len','round','abs','max','min','type','bool']);
function hl(line) {
  let out = '', i = 0; const n = line.length;
  while (i < n) {
    const c = line[i];
    if (c === '#') { out += '<span class="t-com">' + esc(line.slice(i)) + '</span>'; break; }
    const isF = (c === 'f' || c === 'F') && (line[i + 1] === '"' || line[i + 1] === "'") && !/[A-Za-z0-9_]/.test(line[i - 1] || '');
    if (c === '"' || c === "'" || isF) {
      const j = isF ? i + 1 : i, q = line[j]; let k = j + 1;
      while (k < n && line[k] !== q) { if (line[k] === '\\') k++; k++; }
      const end = Math.min(k + 1, n);
      out += '<span class="t-str">' + esc(line.slice(i, end)) + '</span>'; i = end; continue;
    }
    if (/[0-9]/.test(c)) { const m = /^\d+(\.\d+)?/.exec(line.slice(i))[0]; out += '<span class="t-num">' + m + '</span>'; i += m.length; continue; }
    if (/[A-Za-z_]/.test(c)) {
      const m = /^[A-Za-z_]\w*/.exec(line.slice(i))[0];
      const cls = HL_KW.has(m) ? 't-kw' : HL_CONST.has(m) ? 't-num' : (HL_FN.has(m) && /^\s*\(/.test(line.slice(i + m.length))) ? 't-fn' : 't-id';
      out += '<span class="' + cls + '">' + esc(m) + '</span>'; i += m.length; continue;
    }
    if ('=<>!+-*/%:'.includes(c)) { out += '<span class="t-op">' + esc(c) + '</span>'; i++; continue; }
    out += esc(c); i++;
  }
  return out;
}

function insertText(ta, text) {
  ta.focus();

function editorKey(e) {
  const ta = e.target;
  if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); insertText(ta, '    '); }
  else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    const before = ta.value.slice(0, ta.selectionStart), line = before.slice(before.lastIndexOf('\n') + 1);
    let ind = (/^\s*/.exec(line) || [''])[0];
    if (/:\s*$/.test(line)) ind += '    ';
    insertText(ta, '\n' + ind);
  } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); A['lab-run'](); }
}

function go(screen) {
  if (S.exam.cur && screen !== 'exam' && Date.now() >= S.exam.cur.end) { submitExam(true); return; }
  R.screen = screen; R.modal = null; renderModal(); render(); window.scrollTo(0, 0);
}
function curAnswering() {
  if (R.screen === 'exam' && R.exam) return R.exam.insts[R.exam.i];
  if (R.screen === 'challenge' && R.run) {
    const s = R.run.slots[R.run.i];
    return s.stage === 'main' ? s.inst : s.stage === 'follow' ? s.fi : s.stage === 'reinf' ? s.ri : null;
  }
