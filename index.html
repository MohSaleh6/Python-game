/* ---------- mission flow ---------- */
function makeRun(n) {
  S.counter = (S.counter || 0) + 1;
  const defs = Core.pickMission(n, S.seen, Math.random);
  defs.forEach(d => { S.seen[d.id] = S.counter; });
  save();
  const run = { m: n, slots: defs.map(def => ({ inst: mkInst(Core.build(def, rseed())), stage: 'main', credit: 0, status: 'pending', fi: null, ri: null })),
    i: 0, streak: 0, bestStreak: 0, xp: 0, bonus: 0, replay: !!S.missions[n].done, used: new Set(defs.map(d => d.id)), newBadges: [], bossHit: false };
  setLesson(run, 0);
  R.seenCards = new Set();
  return run;
}
function stat(B, ok) {
  S.answered++; if (ok) S.correct++;
  const t = S.topic[B.topic]; if (t) { t.t++; if (ok) t.c++; }
}
function tagMiss(B) { for (const t of B.tags) S.tags[t] = (S.tags[t] || 0) + 1; }
function gain(inst, role) {
  if (inst.awarded) return;
  inst.awarded = true;
  const run = R.run;
  let base = role === 'main' ? 10 + 5 * (inst.q.d - 1) : 5;
  if (inst.hintShown) base = Math.ceil(base / 2);
  if (run.replay) base = Math.ceil(base / 2);
  let bonus = 0;
  if (role !== 'follow') {
    run.streak++; run.bestStreak = Math.max(run.bestStreak, run.streak); S.bestStreak = Math.max(S.bestStreak, run.streak);
    bonus = run.streak >= 5 ? 10 : run.streak >= 3 ? 5 : 0;
    if (run.streak >= 5) award('hot-streak');
  }
  inst.xpGain = base + bonus; inst.streakBonus = bonus; run.xp += base + bonus;
}
function flashBad() { const c = app.querySelector('.qcard:last-of-type'); if (c) { c.classList.remove('flash-bad'); void c.offsetWidth; c.classList.add('flash-bad'); } }
function check() {
  const run = R.run, slot = run.slots[run.i], inst = curAnswering();
  if (!inst || inst.res || !Core.answered(inst.q, inst.sel)) return;
  inst.res = Core.grade(inst.q, inst.sel);
  const ok = inst.res.ok;
  if (slot.stage === 'main') {
    stat(inst.q, ok);
    if (ok) {
      slot.credit = 1; slot.status = 'ok'; gain(inst, 'main'); run.bossHit = true;
      if (inst.q.bug) { S.bugs++; if (S.bugs >= 6) award('bug-hunter'); }
      if (inst.q.follow) { slot.fi = mkInst(Core.buildFollow(inst.q, rseed())); slot.stage = 'follow'; } else slot.stage = 'done';
    } else { slot.credit = 0; slot.status = 'miss'; run.streak = 0; tagMiss(inst.q); slot.stage = 'main-wrong'; }
  } else if (slot.stage === 'follow') {
    if (ok) gain(inst, 'follow'); else { slot.credit = 0.5; slot.status = 'half'; tagMiss(slot.inst.q); }
    slot.stage = 'done';
  } else if (slot.stage === 'reinf') {
    stat(inst.q, ok);
    if (ok) { slot.credit = 0.5; slot.status = 'half'; gain(inst, 'reinf'); run.bossHit = true; }
    else { slot.status = 'miss'; run.streak = 0; tagMiss(inst.q); }
    slot.stage = 'done';
  }
  save();
  if (ok) Sound.ok(); else Sound.bad();
  announce(ok ? 'Correct.' : 'Not quite. Read the explanation.');
  R.lastCheck = Date.now();
  R.refocus = '.qcard .fb:last-of-type';
  render();
  if (!ok) flashBad();
  requestAnimationFrame(() => { const fbs = app.querySelectorAll('.fb'); const f = fbs[fbs.length - 1]; if (f) f.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
}
function next() {
  const run = R.run, slot = run.slots[run.i];
  if (slot.stage === 'main-wrong') {
    const def = Core.similar(slot.inst.q, run.used, Math.random);
    run.used.add(def.id); if (!def.gen) { S.seen[def.id] = S.counter; save(); }
    slot.ri = mkInst(Core.build(def, rseed())); slot.stage = 'reinf';
    render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  if (slot.stage !== 'done') return;
  if (run.i < run.slots.length - 1) { run.i++; render(); window.scrollTo(0, 0); }
  else finishMission();
}
function finishMission() {
  const run = R.run, st = S.missions[run.m], m = MISSIONS[run.m - 1];
  const total = run.slots.reduce((a, s) => a + s.credit, 0), pct = total / run.slots.length;
  const pass = pct >= 0.7 - 1e-9, stars = pass ? (pct >= 0.9 - 1e-9 ? 3 : pct >= 0.8 - 1e-9 ? 2 : 1) : 0;
  let bonus = 0;
  if (pass && !st.done) bonus += 50;
  if (stars > st.stars) bonus += 20 * (stars - st.stars);
  run.bonus = bonus; run.xp += bonus; S.xp += run.xp;
  st.plays++; st.best = Math.max(st.best, pct); st.last = pct;
  if (pass) { st.done = true; st.stars = Math.max(st.stars, stars); award(m.badge); if (stars === 3) award('perfectionist'); }
  run.result = { pct, pass, stars };
  save();
  R.screen = 'result'; render(); window.scrollTo(0, 0);
  if (pass) { Sound.win(); confetti(); }
}

/* ---------- exam flow ---------- */
function loadExam() {
  const c = S.exam.cur;
  R.exam = { insts: c.items.map((it, k) => { const def = EXAM.find(q => q.id === it.id); const inst = mkInst(Core.build(def, it.seed)); if (c.sels[k] != null) inst.sel = c.sels[k]; return inst; }), i: c.i || 0 };
}
function startExam() {
  S.counter = (S.counter || 0) + 1;
  const defs = Core.pickExam(S.seen, Math.random);
  defs.forEach(d => { S.seen[d.id] = S.counter; });
  S.exam.cur = { items: defs.map(d => ({ id: d.id, seed: rseed() })), sels: defs.map(() => null), flags: [], i: 0, start: Date.now(), end: Date.now() + 20 * 60 * 1000 };
  save(); loadExam(); R.seenCards = new Set(); go('exam');
}
function persistExam() { const c = S.exam.cur; if (!c || !R.exam) return; c.sels = R.exam.insts.map(x => x.sel); c.i = R.exam.i; save(); }
function tick() {
  const c = S.exam.cur; if (!c) return;
  const left = c.end - Date.now();
  if (left <= 0) { submitExam(true); return; }
  const el = document.getElementById('exam-timer');
  if (el) { el.innerHTML = icon('clock') + fmtTime(left); el.className = 'timer' + (left < 60000 ? ' crit' : left < 300000 ? ' warn' : ''); }
}
function submitExam(auto) {
  const c = S.exam.cur; if (!c) return;
  if (R.timer) { clearInterval(R.timer); R.timer = null; }
  if (!R.exam) loadExam();
  const items = R.exam.insts.map((inst, k) => {
    const ans = Core.answered(inst.q, inst.sel), r = ans ? Core.grade(inst.q, inst.sel) : { ok: false };
    return { id: c.items[k].id, seed: c.items[k].seed, sel: inst.sel, ok: !!r.ok, topic: inst.q.topic, answered: ans };
  });
  const correct = items.filter(x => x.ok).length, score = Math.round(correct / items.length * 100);
  const topics = {}; for (const m of MISSIONS) topics[m.key] = [0, 0];
  items.forEach(x => { topics[x.topic][1]++; if (x.ok) topics[x.topic][0]++; S.answered++; if (x.ok) S.correct++; const t = S.topic[x.topic]; t.t++; if (x.ok) t.c++; });
  const prev = S.exam.best, gainXp = Math.max(0, score - (prev || 0));
  if (prev == null || score >= prev) S.exam.bestRun = { score, topics };
  S.xp += gainXp; S.exam.best = Math.max(prev || 0, score); S.exam.attempts++;
  S.exam.last = { score, correct, total: items.length, topics, items, date: Date.now(), auto: !!auto, used: Math.min(c.end, Date.now()) - c.start, xp: gainXp };
  S.exam.cur = null; R.exam = null; R.review = null;
  if (score >= 60) award('escapee');
  if (score >= 90) award('exam-ace');
  save();
  R.screen = 'examResult'; R.modal = null; renderModal(); render(); window.scrollTo(0, 0);
  if (auto) toast('<div><b>Time is up</b><small>Your exam was submitted automatically.</small></div>');
  if (score >= 60) { Sound.win(); confetti(); }
}

/* ---------- actions ---------- */
function afterSel() { if (R.screen === 'exam') persistExam(); render(); }
const A = {
  home() { if (R.screen === 'challenge' && R.run) return A.quit(); R.run = null; go('map'); },
  settings() { openModal({ k: 'settings' }); },
  close() { closeModal(); },
  overlay(el, e) { if (e.target === el && R.modal && R.modal.k !== 'confirm') closeModal(); },
  'confirm-yes'() { const f = R.modal && R.modal.onYes; closeModal(); if (f) f(); },
  'toggle-sound'() { S.sound = !S.sound; save(); renderModal(); },
  'toggle-teacher'() { S.teacher = !S.teacher; save(); renderModal(); render(); },
  reset() {
    confirmBox('Reset all progress?', 'This permanently deletes your XP, stars, badges and exam results on this device.', 'Delete everything', () => {
      S = defaults(); save(); R.run = null; R.exam = null; R.review = null; go('intro');
    }, { danger: true, no: 'Keep my progress' });
  },
  start(el) {
    const n = +el.dataset.m; if (!unlocked(n)) return;
    if (S.exam.cur) { confirmBox('Your exam is still running', 'The exam timer keeps running while you practise. Resume the exam instead?', 'Resume the exam', () => A['exam-resume']()); return; }
    R.run = makeRun(n); go('brief');
  },
  quit() {
    confirmBox('Leave this room?', 'Your answers and the XP from this attempt will be lost. Completed rooms and badges stay saved.', 'Leave the room', () => { R.run = null; go('map'); }, { no: 'Keep playing' });
  },
  lnext() { setLesson(R.run, Math.min(R.run.lesson + 1, LESSONS[R.run.m].length - 1)); render(); window.scrollTo(0, 0); },
  lprev() { setLesson(R.run, Math.max(R.run.lesson - 1, 0)); render(); window.scrollTo(0, 0); },
  lvary(el) { const Ls = LESSONS[R.run.m][R.run.lesson]; R.run.lv = Ls.vary.find(v => String(v) === el.dataset.v); R.run.lr = null; A.lrun(); },
  lrun() {
    const run = R.run, Ls = LESSONS[run.m][run.lesson];
    if (Ls.ask) run.la = Ls.ask.map((d, k) => { const inp = document.getElementById('lask-' + k); return inp ? inp.value : d; });
    run.lr = PyLite.run(lessonCode(Ls, run), run.la);
    R.refocus = '[data-act="lrun"]'; render();
  },
  'brief-skip'() { R.screen = 'challenge'; render(); window.scrollTo(0, 0); },
  hint() { const inst = curAnswering(); if (inst && !inst.res) { inst.hintShown = true; render(); } },
  check() { check(); },
  next() { next(); },
  trace(el) { const t = R.traces[+el.dataset.tr]; if (t) openTrace(t.code, t.inputs); },
  'tr-next'() { const md = R.modal; if (md.i < md.res.trace.length - 1) { md.i++; renderModal(); } },
  'tr-prev'() { const md = R.modal; if (md.i > 0) { md.i--; renderModal(); } },
  'tr-first'() { R.modal.i = 0; renderModal(); },
  opt(el) { const inst = curAnswering(); if (!inst || inst.res || inst.q.type !== 'mcq') return; inst.sel = +el.dataset.i; Sound.tap(); afterSel(); },
  line(el) { const inst = curAnswering(); if (!inst || inst.res || inst.q.type !== 'line') return; inst.sel = +el.dataset.i; Sound.tap(); afterSel(); },
  blank(el) {
    const inst = curAnswering(); if (!inst || inst.res) return;
    const i = +el.dataset.i; if (inst.sel[i] != null && inst.focus === i) inst.sel[i] = null;
    inst.focus = i; afterSel();
  },
  chip(el) {
    const inst = curAnswering(); if (!inst || inst.res) return;
    let f = inst.focus; if (f == null) f = inst.sel.findIndex(v => v == null); if (f < 0) return;
    inst.sel[f] = el.dataset.t;
    const nextEmpty = inst.sel.findIndex((v, k) => v == null && k > f), anyEmpty = inst.sel.findIndex(v => v == null);
    inst.focus = nextEmpty >= 0 ? nextEmpty : anyEmpty >= 0 ? anyEmpty : null;
    Sound.tap(); afterSel();
  },
  'ord-add'(el) { const inst = curAnswering(); if (!inst || inst.res) return; inst.sel.push(+el.dataset.i); Sound.tap(); afterSel(); },
  'ord-del'(el) { const inst = curAnswering(); if (!inst || inst.res) return; inst.sel.splice(+el.dataset.k, 1); afterSel(); },
  'ord-reset'() { const inst = curAnswering(); if (!inst || inst.res) return; inst.sel = []; afterSel(); },
  'ch-up'(el) { const inst = curAnswering(); if (!inst || inst.res) return; const k = +el.dataset.k; if (k > 0) { [inst.sel[k - 1], inst.sel[k]] = [inst.sel[k], inst.sel[k - 1]]; R.refocus = '[data-act="ch-up"][data-k="' + (k - 1) + '"]'; afterSel(); } },
  'ch-down'(el) { const inst = curAnswering(); if (!inst || inst.res) return; const k = +el.dataset.k; if (k < inst.sel.length - 1) { [inst.sel[k + 1], inst.sel[k]] = [inst.sel[k], inst.sel[k + 1]]; R.refocus = '[data-act="ch-down"][data-k="' + (k + 1) + '"]'; afterSel(); } },
  tcell(el) { const inst = curAnswering(); if (!inst || inst.res) return; inst.sel[+el.dataset.r] = +el.dataset.c; Sound.tap(); afterSel(); },
  'm-left'(el) { const inst = curAnswering(); if (!inst || inst.res) return; inst.pickL = +el.dataset.i; afterSel(); },
  'm-right'(el) {
    const inst = curAnswering(); if (!inst || inst.res) return;
    const j = +el.dataset.j;
    if (inst.pickL == null) { for (const k of Object.keys(inst.sel)) if (inst.sel[k] === j) delete inst.sel[k]; afterSel(); return; }
    for (const k of Object.keys(inst.sel)) if (inst.sel[k] === j) delete inst.sel[k];
    inst.sel[inst.pickL] = j;
    const n = inst.q.left.length; let nx = null;
    for (let s = 1; s <= n; s++) { const k = (inst.pickL + s) % n; if (inst.sel[k] == null) { nx = k; break; } }
    inst.pickL = nx; Sound.tap(); afterSel();
  },
  'exam-intro'() { if (S.exam.cur) return A['exam-resume'](); if (!examUnlocked()) return; R.run = null; go('examIntro'); },
  'exam-start'() { if (!examUnlocked()) return; startExam(); },
  'exam-resume'() { if (!S.exam.cur) return go('map'); if (Date.now() >= S.exam.cur.end) { submitExam(true); return; } if (!R.exam) loadExam(); R.run = null; go('exam'); },
  'exam-leave'() { persistExam(); toast('<div><b>The exam is paused on screen, not in time</b><small>The timer keeps running. Resume it from the map.</small></div>'); go('map'); },
  'exam-result'() { go('examResult'); },
  'ex-go'(el) { R.exam.i = +el.dataset.i; persistExam(); render(); },
  'ex-prev'() { if (R.exam.i > 0) { R.exam.i--; persistExam(); render(); window.scrollTo(0, 0); } },
  'ex-next'() { if (R.exam.i < R.exam.insts.length - 1) { R.exam.i++; persistExam(); render(); window.scrollTo(0, 0); } },
  'ex-flag'() { const c = S.exam.cur, i = R.exam.i, k = c.flags.indexOf(i); if (k >= 0) c.flags.splice(k, 1); else c.flags.push(i); persistExam(); R.refocus = '[data-act="ex-flag"]'; render(); },
  'ex-submit'() {
    const left = R.exam.insts.filter(x => !Core.answered(x.q, x.sel)).length, fl = S.exam.cur.flags.length;
    confirmBox('Submit your exam?', (left ? '<b>' + left + ' question' + (left > 1 ? 's are' : ' is') + ' not answered.</b> ' : 'All questions are answered. ') + (fl ? fl + ' flagged for review. ' : '') + 'You cannot change your answers after submitting.', 'Submit the exam', () => submitExam(false), { no: 'Keep working' });
  },
  report() { R.run = null; go('report'); },
  lab() { R.run = null; go('lab'); },
  'lab-run'() {
    const ta = document.getElementById('lab-code'); if (!ta) return;
    const code = ta.value.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
    if (code !== ta.value) { ta.value = code; toast('<div><b>Curly quotes fixed</b><small>They were changed to straight quotes so Python can read them.</small></div>'); }
    const Lb = R.lab; Lb.code = code; S.lab = code; save();
    Lb.sess = PyLite.session(code); Lb.inputs = []; Lb.done = false; Lb.err = null; Lb.waiting = null; Lb.ranCode = code;
    labAdvance(undefined);
  },
  'lab-trace'() { const Lb = R.lab; if (Lb.done && Lb.ranCode != null) openTrace(Lb.ranCode, Lb.inputs); }
};
const FORMS = {
  intro() { const v = (document.getElementById('agent-name').value || '').trim().slice(0, 20); S.name = v; S.started = true; save(); go('map'); },
  name() { S.name = (document.getElementById('set-name').value || '').trim().slice(0, 20); save(); closeModal(); render(); toast('<div><b>Name saved</b></div>'); },
  'lab-in'() { const inp = document.getElementById('lab-input'); const v = inp ? inp.value : ''; R.lab.inputs.push(v); labAdvance(v); }
};
function refocusSelector(el) {
  const d = el.dataset; let s = '[data-act="' + d.act + '"]';
  for (const k of ['i', 'k', 'j', 'r', 'c', 'm']) if (d[k] != null) s += '[data-' + k + '="' + d[k] + '"]';
  return s;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, h = A[act]; if (!h) return;
  if (act === 'overlay' && e.target !== el) return;
  e.preventDefault(); Sound.unlock();
  if (!R.refocus && el.tagName === 'BUTTON' && app.contains(el)) R.refocus = refocusSelector(el);
  h(el, e);
});
document.addEventListener('submit', e => { const f = e.target.dataset.form; if (!f) return; e.preventDefault(); Sound.unlock(); if (FORMS[f]) FORMS[f](e.target); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ans-type') { const inst = curAnswering(); if (inst && !inst.res) { inst.sel = t.value; if (R.screen === 'exam') persistExam(); const b = app.querySelector('[data-act="check"]'); if (b) b.disabled = !Core.answered(inst.q, inst.sel); } }
  if (t.id === 'lab-code') { labGutter(); R.lab.code = t.value; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'lab-ex' && e.target.value !== '') {
    const ex = LAB_EXAMPLES[+e.target.value]; R.lab.code = ex.code; R.lab.sess = null; R.lab.done = false; R.lab.err = null; R.lab.waiting = null;
    const ta = document.getElementById('lab-code'); ta.value = ex.code; e.target.value = ''; labGutter(); labTerm();
  }
});
document.addEventListener('scroll', e => { if (e.target && e.target.id === 'lab-code') labGutter(); }, true);
document.addEventListener('keydown', e => {
  if (R.modal) {
    if (e.key === 'Escape' && R.modal.k !== 'confirm') { e.preventDefault(); closeModal(); }
    else if (e.key === 'Escape') closeModal();
    else if (R.modal.k === 'trace' && e.key === 'ArrowRight') A['tr-next']();
    else if (R.modal.k === 'trace' && e.key === 'ArrowLeft') A['tr-prev']();
    else if (e.key === 'Tab') { const f = [...modalRoot.querySelectorAll('button:not([disabled]), input, [href]')]; if (f.length) { const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } } }
    return;
  }
  const t = e.target;
  if (t.id === 'lab-code') { editorKey(e); return; }
  if (t.id === 'ans-type') { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (R.screen === 'challenge') check(); } return; }
  if (t.matches && t.matches('input, textarea, select')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (R.screen === 'challenge' || R.screen === 'exam') {
    const inst = curAnswering();
    if (inst && !inst.res && inst.q.type === 'mcq') {
      let k = '1234'.indexOf(e.key); if (k < 0) k = 'abcd'.indexOf(e.key.toLowerCase());
      if (k >= 0 && k < inst.q.opts.length) { inst.sel = k; afterSel(); return; }
    }
    if (e.key === 'Enter' && R.screen === 'challenge' && !(t.matches && t.matches('button, a, summary'))) {
      e.preventDefault();
      if (inst && !inst.res) check(); else if (Date.now() - (R.lastCheck || 0) > 900) next();
    }
  }
});
window.addEventListener('storage', e => { if (e.key === KEY && !R.run && !S.exam.cur) { S = load(); render(); } });

// Expose for automated testing only.
window.PQ = { get S() { return S; }, R, Core, PyLite, A };

if (S.exam.cur && Date.now() >= S.exam.cur.end) submitExam(true);
else render();
})();
